<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Happy+Monkey&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Double:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>Portfolio</title>
</head>

<body>
<div class="scoreboard">
  <div class="home">
    <h1>HOME</h1>
    <div class="score" id="home">0</div>
    <div class="score-add">
      <button class="btn" onclick="inc(1,'home')">1</button>
      <button class="btn" onclick="inc(2,'home')">2</button>
      <button class="btn" onclick="inc(3,'home')">3</button>
       <button class="btn" onclick="cleart('home')">CLR</button>
    </div>
  </div>
  <div class="guest">
  <div class="score" id="guest">0</div>
  <div class="score-add">
    <button class="btn" onclick="inc(1,'guest')" >1</button>
      <button class="btn" onclick="inc(2,'guest')">2</button>
      <button class="btn" onclick="inc(3,'guest')">3</button>
      <button class="btn" onclick="cleart('guest')">CLR</button>
  </div>
  </div>
  
</div>
<script src="index.js"></script>

</body>

</html>
